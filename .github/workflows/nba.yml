name: Build nba_stats

on:
  workflow_dispatch:
    inputs:
      season:
        description: "NBA season, e.g. 2025-26 (blank = default 2025-26)"
        required: false
        default: ""
      season_type:
        description: "Regular Season or Pre Season (blank = Regular Season)"
        required: false
        default: ""
  schedule:
    # odd minute, several times a day (GitHub cron drops :00 jobs under load)
    - cron: "23 11,15,19,23 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Build nba_stats.json
        env:
          SCRAPEOPS_API_KEY: ${{ secrets.SCRAPEOPS_API_KEY }}
          NBA_SEASON: ${{ github.event.inputs.season }}
          NBA_SEASON_TYPE: ${{ github.event.inputs.season_type }}
        run: python build_nba.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nba_stats.json
          git diff --staged --quiet && { echo "no changes"; exit 0; }
          git commit -m "update nba_stats.json"
          # Resilient push: other feed workflows push to this same repo constantly,
          # so rebase our one-file change onto the latest main and retry on contention.
          for i in 1 2 3 4 5 6; do
            git pull --rebase --autostash origin main \
              && git push && { echo "pushed on attempt $i"; exit 0; }
            echo "push attempt $i lost the race, retrying..."
            sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "push failed after 6 attempts" >&2
          exit 1
